<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <!-- PrismJS theme for syntax highlighting -->
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
    <style>
      /* Font Awesome now loaded via <link> above */

      body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, calc(0.3 + var(--app-opacity, 1) * 0.7)) 0%,
          rgba(20, 20, 20, calc(0.4 + var(--app-opacity, 1) * 0.6)) 100%
        );
        backdrop-filter: blur(25px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, calc(0.1 * var(--app-opacity, 1)));
        box-shadow: 0 4px 25px rgba(0, 0, 0, calc(0.15 * var(--app-opacity, 1)));
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }
      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, calc(0.08 * var(--app-opacity, 1)));
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        background: rgba(0, 0, 0, calc(0.2 * var(--app-opacity, 1)));
        backdrop-filter: blur(10px);
        cursor: move;
        flex-shrink: 0;
      }
      .header-title {
        color: rgba(255, 255, 255, 0.95);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      /* Header actions (e.g., Clear History) */
      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-button {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .recording-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4757;
        animation: pulse 2s infinite;
        display: none;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      }
      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .chat-messages {
        flex: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
        /* Removed max-height restriction */
      }
      .message {
        margin-bottom: 16px;
        padding: 12px 16px;
        max-width: 82%;
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        word-wrap: break-word;
        word-break: break-word;
        /* Removed all height restrictions */
        position: relative;
      }
      .message.transcription {
        background: rgba(76, 175, 80, 0.15);
        animation: fadeInSlide 0.1s ease-out;
        position: relative;
        min-width: 280px;
      }

      .message.transcription::before {
        position: absolute;
        left: -8px;
        top: 8px;
        font-size: 12px;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeInSlide {
        from {
          opacity: 0;
          transform: translateX(-20px);
          background: rgba(76, 175, 80, 0.3);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: rgba(76, 175, 80, 0.15);
        }
      }
      .message.system {
        background: rgba(33, 150, 243, 0.1);
        align-self: center;
        max-width: 90%;
        text-align: center;
      }
      .message.error {
        background: rgba(244, 67, 54, 0.1);
        align-self: center;
        max-width: 90%;
      }
      .message.user {
        align-self: flex-end;
        margin-left: auto;
        border-left: 0;
        border-right: 3px solid #ff9800;
        border-radius: 16px 6px 16px 16px;
        background: rgba(255, 152, 0, 0.18);
      }
      .message.assistant {
        align-self: flex-start;
        margin-right: auto;
        border-radius: 6px 16px 16px 16px;
        background: rgba(156, 39, 176, 0.1);
        border-left: 3px solid #9c27b0;
        /* Removed all height restrictions and overflow hidden */
        display: block;
      }
      
      .message.assistant .message-text {
        /* Removed all height restrictions and overflow hidden */
        white-space: normal;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      .message.assistant.streaming .message-text {
        white-space: pre-wrap;
      }
      .send-button.stop-mode {
        background: rgba(255, 71, 87, 0.28);
        color: #ff9ca5;
      }
      .send-button.stop-mode:hover {
        background: rgba(255, 71, 87, 0.42);
        color: #fff;
      }
      .response-status {
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
      }
      .message.transcription {
        align-self: flex-end;
        margin-left: auto;
        border-left: 0;
        border-right: 3px solid #4caf50;
        border-radius: 16px 6px 16px 16px;
        min-width: 280px;
      }
      .message-role {
        margin-bottom: 4px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .message.user .message-role,
      .message.transcription .message-role {
        text-align: right;
      }
      
      /* Ensure all content in assistant messages is fully visible */
      .message.assistant .bullet-point,
      .message.assistant .numbered-point,
      .message.assistant strong,
      .message.assistant em,
      .message.assistant ul,
      .message.assistant ol,
      .message.assistant li,
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6,
      .message.assistant p,
      .message.assistant blockquote {
        /* Remove all height restrictions */
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      
      /* Markdown formatting for assistant messages */
      .message.assistant .bullet-point {
        margin: 4px 0;
        padding-left: 8px;
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point {
        margin: 4px 0;
        padding-left: 16px;
        line-height: 1.4;
        position: relative;
        counter-increment: list-counter;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point::before {
        content: counter(list-counter) ". ";
        position: absolute;
        left: 0;
        font-weight: 500;
        color: rgba(156, 39, 176, 0.8);
      }
      
      .message.assistant {
        counter-reset: list-counter;
      }
      
      .message.assistant strong {
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }
      
      .message.assistant code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        display: inline;
      }
      
      /* Ensure code blocks are fully visible */
      .message.assistant pre {
        background: rgba(0, 0, 0, 0.2);
        padding: 10px 14px;
        border-radius: 0 0 6px 6px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        overflow-x: auto;
        white-space: pre;
        word-wrap: normal;
        margin: 0;
        position: relative;
        max-width: 100%;
        max-height: 320px;
        box-sizing: border-box;
        overflow: auto;
      }
      
      .message.assistant pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
        color: inherit;
      }

      /* Code block wrapper (like center panel) */
      .message.assistant .code-block {
        background: rgba(0, 0, 0, 0.3);
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        overflow: hidden;
        max-width: 100%;
        min-width: 0;
      }
      
      .message.assistant .code-header {
        background: rgba(0, 0, 0, 0.45);
        padding: 7px 14px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        font-weight: 700;
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: space-between;
        letter-spacing: 0.3px;
      }
      
      .message.assistant .code-content {
        max-height: 320px;
        overflow: auto;
        background: rgba(0, 0, 0, 0.2);
        min-width: 0;
      }

      /* Copy button in code blocks */
      .copy-btn {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 3px 10px;
        font-size: 10px;
        border-radius: 4px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background 0.2s ease, border-color 0.2s ease;
        font-weight: 500;
      }
      .copy-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 1);
      }
      .copy-btn.copied {
        background: rgba(76, 175, 80, 0.7);
        border-color: rgba(76, 175, 80, 0.8);
        color: #fff;
      }
      
      /* Ensure lists are fully visible */
      .message.assistant ul,
      .message.assistant ol {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .message.assistant li {
        margin: 4px 0;
        line-height: 1.4;
      }
      
      /* Ensure headings are fully visible */
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 {
        margin: 12px 0 8px 0;
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant h1 { font-size: 16px; }
      .message.assistant h2 { font-size: 15px; }
      .message.assistant h3 { font-size: 14px; }
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 { font-size: 13px; }
      
      /* Ensure paragraphs are fully visible */
      .message.assistant p {
        margin: 8px 0;
      }
      
      /* Ensure blockquotes are fully visible */
      .message.assistant blockquote {
        border-left: 3px solid rgba(156, 39, 176, 0.5);
        padding-left: 12px;
        margin: 8px 0;
        font-style: italic;
        color: rgba(255, 255, 255, 0.8);
      }
      
      /* Thinking indicator animation */
      .thinking-dots {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      
      .thinking-dots .dot {
        opacity: 0.4;
        animation: thinking 1.4s infinite ease-in-out;
      }
      
      .thinking-dots .dot:nth-child(1) { animation-delay: 0s; }
      .thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes thinking {
        0%, 80%, 100% {
          opacity: 0.4;
          transform: scale(1);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      
      .message.thinking {
        animation: fadeIn 0.3s ease-out;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .message-time {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .message-text {
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        max-width: 100%;
        display: block;
      }
      .message-text .math {
        font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
        white-space: nowrap;
      }
      .message-text sup, .message-text sub {
        font-size: 0.72em;
        line-height: 0;
      }
      .chat-input {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: no-drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        flex-shrink: 0;
      }
      .input-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        -webkit-app-region: no-drag;
      }
      .input-field {
        flex: 1;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        outline: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        /* make it work well as multiline */
        resize: none;
        line-height: 1.4;
        min-height: 32px;
        max-height: 140px;
        overflow-y: auto;
      }
      .input-field:focus {
        outline: none;
      }
      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .send-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .send-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .status-message {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        padding: 20px;
        font-style: italic;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .error-message {
        color: #ff4757;
        font-size: 12px;
        padding: 10px;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .mic-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .mic-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .mic-button.recording {
        background: rgba(255, 71, 87, 0.8);
        color: white;
        box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
      }
      .help-text {
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        text-align: center;
        padding: 10px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .interaction-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1000;
      }
      .interaction-indicator.show {
        opacity: 1;
      }
      .interaction-indicator.interactive {
        background: rgba(76, 175, 80, 0.9);
      }
      .interaction-indicator.non-interactive {
        background: rgba(244, 67, 54, 0.9);
      }
      .non-interactive .input-container {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .mic-button {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .send-button {
        pointer-events: none;
        opacity: 0.5;
      }

      /* Minimalist Listening Animation */
      .listening-indicator {
        display: none;
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(203, 203, 203, 0.3);
        border-radius: 20px;
        padding: 8px 16px;
        z-index: 1000;
        pointer-events: none;
      }

      .listening-indicator.active {
        display: flex;
        align-items: center;
        gap: 8px;
        animation: fadeInUp 0.3s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .listening-wave {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .wave-bar {
        width: 2px;
        background: #4caf50;
        border-radius: 1px;
        animation: waveAnimation 1.2s infinite ease-in-out;
      }

      .wave-bar:nth-child(1) {
        height: 8px;
        animation-delay: 0s;
      }
      .wave-bar:nth-child(2) {
        height: 12px;
        animation-delay: 0.15s;
      }
      .wave-bar:nth-child(3) {
        height: 16px;
        animation-delay: 0.3s;
      }
      .wave-bar:nth-child(4) {
        height: 12px;
        animation-delay: 0.45s;
      }
      .wave-bar:nth-child(5) {
        height: 8px;
        animation-delay: 0.6s;
      }

      @keyframes waveAnimation {
        0%, 100% {
          transform: scaleY(0.3);
          opacity: 0.6;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .listening-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .listening-duration {
        color: rgba(76, 175, 80, 0.8);
        font-size: 10px;
        font-family: monospace;
        margin-left: 4px;
      }

      .listening-cancel {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        margin-left: 4px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        font-size: 10px;
        cursor: pointer;
        pointer-events: auto;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .listening-cancel:hover {
        background: rgba(244, 67, 54, 0.35);
        color: #fff;
      }

      /* Transcribing state: same pill, different color + no duration */
      .listening-indicator.state-transcribing .wave-bar {
        background: #4a9eff;
        animation-duration: 0.9s;
      }

      .listening-indicator.state-transcribing .listening-duration {
        display: none;
      }

      /* Interim text overlay */
      .interim-overlay {
        position: fixed;
        bottom: 80px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.028);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(76, 175, 80, 0.3);
        border-radius: 8px;
        padding: 12px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 12px;
        font-style: italic;
        z-index: 999;
        pointer-events: none;
        display: none;
        animation: slideUpFade 0.3s ease-out;
      }

      .interim-overlay.active {
        display: block;
      }

      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="header-title">
          <i class="fas fa-microphone"></i>
          Live Transcription & Chat
          <div class="recording-indicator" id="recordingIndicator"></div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="clearHistoryBtn" title="Clear chat history">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <!-- Listening / Transcribing wave indicator -->
      <div class="listening-indicator" id="listeningIndicator">
        <div class="listening-wave">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
        <span class="listening-text" id="listeningText">Listening…</span>
        <span class="listening-duration" id="listeningDuration"></span>
        <button class="listening-cancel" id="listeningCancelBtn" title="Cancel">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Interim Text Overlay -->
      <div class="interim-overlay" id="interimOverlay"></div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-input">
        <div class="input-container">
          <textarea
            class="input-field"
            placeholder="Type a message… (Shift+Enter for newline)"
            id="messageInput"
            rows="1"
          ></textarea>
          <button class="mic-button" id="micButton">
            <i class="fas fa-microphone"></i>
          </button>
          <button class="send-button" id="sendButton">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS core and autoloader for language components -->
    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
      // Configure Prism autoloader
      try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}
    </script>
    <script>
      // Use electronAPI from preload script instead of direct require
      const whysperAPI = window.electronAPI;

      // Keep CSS --app-opacity in sync with shortcuts
      if (whysperAPI && whysperAPI.receive) {
        whysperAPI.receive('opacity-changed', (_event, data) => {
          if (data && data.opacity !== undefined) {
            document.documentElement.style.setProperty('--app-opacity', data.opacity);
          }
        });
      }

      const chatMessages = document.getElementById('chatMessages');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const micButton = document.getElementById('micButton');
      const chatContainer = document.getElementById('chatContainer');
      const listeningIndicator = document.getElementById('listeningIndicator');
      const listeningDuration = document.getElementById('listeningDuration');
      const listeningText = document.getElementById('listeningText');
      const listeningCancelBtn = document.getElementById('listeningCancelBtn');
      const interimOverlay = document.getElementById('interimOverlay');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      let isRecording = false;
      let isInteractive = true;
      let listeningStartTime = null;
      let listeningTimer = null;
      let speechAvailable = false;
      let chatMediaRecorder = null;
      let chatMediaStream = null;
      let chatRecordingChunks = [];
      let chatRecordingStartedAt = 0;
      const liveResponses = new Map();
      let chatRecordingTimeout = null;
      let isStartingRecording = false;
      // True while the mic is stopped locally but the user hit Cancel before
      // the recorder's 'stop' event fired — skips submitting the audio.
      let cancelRecordingFlag = false;
      // True after Cancel is clicked while already "Transcribing" (audio
      // already sent to main process). There's no in-flight abort for the
      // STT request, so we just ignore whatever draft/error comes back next.
      let transcriptionCancelledForNextDraft = false;
      // Monotonic counter bumped on each new recording so stale transcription
      // results from a previous (still-in-flight) recording are discarded.
      let lastRecordingGeneration = 0;

      // Chat persistence and deduplication
      const CHAT_HISTORY_KEY = 'opencluely_chat_history_v1';
      let chatHistory = [];
      let historyLoadGeneration = 0;
      const recentResponseHashes = new Set();
      const RECENT_HASH_LIMIT = 50;

      function hashString(str) {
        try {
          let h = 2166136261 >>> 0; // FNV-1a
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        } catch (_) {
          return String(str?.length || 0);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-500)));
        } catch (e) {
          console.warn('Failed to save history', e);
        }
      }

      async function renderHistoryItem(item) {
        if (item.kind === 'message') {
          addMessage(item.text, item.type, true);
        } else if (item.kind === 'voice') {
          // Legacy entries persisted before audio playback was removed from
          // chat history — render as plain text, no audio player.
          addMessage(item.error ? `Transcription failed: ${item.error}` : (item.text || ''), 'transcription', true);
        } else if (item.kind === 'snippet') {
          addCodeSnippet(item.language, item.code, true);
        } else if (item.kind === 'image') {
          await addScreenshotThumbnail(item.screenshotId, item.screenshotPath, true);
        }
      }

      async function renderHistory(items) {
        if (!Array.isArray(items)) return;
        for (const item of items) {
          await renderHistoryItem(item);
        }
      }

      async function loadHistoryFromMain() {
        try {
          if (!window.electronAPI || !window.electronAPI.getFullConversationHistory) {
            return false;
          }
          const history = await window.electronAPI.getFullConversationHistory();
          if (!Array.isArray(history)) {
            return false;
          }

          // Convert main-process conversation events to chat history format
          const newChatHistory = [];
          history.forEach(event => {
            if (event.role === 'system') return;

            // Screenshot events carry image metadata, not text content
            if (event.action === 'screenshot_captured' && event.screenshot) {
              newChatHistory.push({
                kind: 'image',
                screenshotId: event.screenshot.screenshotId,
                screenshotPath: event.screenshot.screenshotPath,
                time: event.timestamp
              });
              return;
            }

            if (!event.content || typeof event.content !== 'string') return;

            if (event.role === 'model') {
              // Split model response into text + snippets
              const blocks = extractCodeBlocks(event.content);
              const textOnly = stripCodeBlocks(event.content, blocks);
              if (textOnly && textOnly.trim().length) {
                newChatHistory.push({ kind: 'message', type: 'assistant', text: textOnly });
              }
              blocks.forEach(b => {
                newChatHistory.push({ kind: 'snippet', language: b.language, code: b.code });
              });
            } else {
              // User event
              let type = 'user';
              if (event.action === 'speech_transcription') type = 'transcription';
              else if (event.action === 'ocr_extraction') type = 'system';
              // Audio metadata (if any, from legacy entries) is no longer used
              // for chat display — no playable audio in chat history.
              newChatHistory.push({ kind: 'message', type, text: event.content });
            }
          });

          chatHistory = newChatHistory;
          saveHistory();
          return true;
        } catch (error) {
          console.warn('Failed to load history from main process', error);
          return false;
        }
      }

      async function loadHistory() {
        const loadGeneration = historyLoadGeneration;
        try {
          console.log('[CHAT] Loading history...');
          if (chatMessages) {
            chatMessages.innerHTML = '';
          }

          const loadedFromMain = await loadHistoryFromMain();
          if (loadGeneration !== historyLoadGeneration) return;
          if (loadedFromMain) {
            await renderHistory(chatHistory);
            console.log('[CHAT] Rendered', chatHistory.length, 'items from main process');
          }

          if (!loadedFromMain) {
            // Main process was empty; fall back to full localStorage history
            const raw = localStorage.getItem(CHAT_HISTORY_KEY);
            if (!raw) {
              console.log('[CHAT] No local history found');
              return;
            }
            const items = JSON.parse(raw);
            chatHistory = items;
            await renderHistory(items);
            console.log('[CHAT] Rendered', items.length, 'items from localStorage');
          }
        } catch (e) {
          console.warn('Failed to load history', e);
        }
      }

      function clearChatHistory(skipConfirm = false, skipMainClear = false) {
        if (!skipConfirm) {
          const ok = confirm('Clear chat history?');
          if (!ok) return;
        }
        historyLoadGeneration += 1;
        chatHistory = [];
        localStorage.removeItem(CHAT_HISTORY_KEY);
        if (!skipMainClear && window.electronAPI && window.electronAPI.clearSessionMemory) {
          window.electronAPI.clearSessionMemory().catch(error => console.warn('Failed to clear persisted audio', error));
        }
        // Clear DOM
        if (chatMessages) chatMessages.innerHTML = '';
        // Clear IndexedDB images too
        openImageDB().then((db) => {
          try {
            const tx = db.transaction('screenshots', 'readwrite');
            tx.objectStore('screenshots').clear();
            tx.onerror = () => console.warn('Failed to clear IndexedDB images');
          } catch (e) {
            console.warn('IndexedDB clear error:', e);
          }
        }).catch(() => {});
      }

      function applyMicVisibility() {
        if (micButton) {
          micButton.style.display = speechAvailable ? '' : 'none';
        }
      }
      
      async function initSpeechAvailability() {
        try {
          if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
            speechAvailable = await window.electronAPI.getSpeechAvailability();
            applyMicVisibility();
          }
        } catch (e) {
          speechAvailable = false;
          applyMicVisibility();
        }
      }

      // Listen for availability changes
      if (whysperAPI && whysperAPI.onSpeechAvailability) {
        whysperAPI.onSpeechAvailability((event, data) => {
          speechAvailable = !!(data && data.available);
          applyMicVisibility();
        });
      }

      // Auto-focus input when chat window becomes visible
      if (whysperAPI && whysperAPI.onFocusChatInput) {
        whysperAPI.onFocusChatInput(() => {
          if (messageInput) messageInput.focus();
        });
      }

      // Also capture generic LLM responses (from OCR/screenshot flows)
      if (whysperAPI && whysperAPI.onLlmResponse) {
        whysperAPI.onLlmResponse((event, data) => {
          try { hideThinkingIndicator(); } catch (_) {}
          if (data && data.response) {
            renderAssistantResponse(data.response);
          }
        });
      }

      // ---- IndexedDB for screenshot persistence (larger than localStorage) ----
      let imageDB = null;
      function openImageDB() {
        return new Promise((resolve, reject) => {
          if (imageDB) return resolve(imageDB);
          const req = indexedDB.open('opencluely_images', 1);
          req.onupgradeneeded = () => { req.result.createObjectStore('screenshots'); };
          req.onsuccess = () => { imageDB = req.result; resolve(imageDB); };
          req.onerror = () => reject(req.error);
        });
      }
      async function saveImageToDB(id, dataUrl) {
        const db = await openImageDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('screenshots', 'readwrite');
          tx.objectStore('screenshots').put(dataUrl, id);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }
      async function loadImageFromDB(id) {
        const db = await openImageDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('screenshots', 'readonly');
          const req = tx.objectStore('screenshots').get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      // Render a screenshot thumbnail by loading from the main-process file store.
      // Falls back to IndexedDB for legacy entries that still use imageId.
      async function addScreenshotThumbnail(screenshotId, screenshotPath, skipPersist) {
        let dataUrl = null;

        // Primary path: load from main-process disk store (survives restart)
        if (screenshotPath && window.electronAPI && window.electronAPI.loadScreenshotFile) {
          try {
            const result = await window.electronAPI.loadScreenshotFile(screenshotPath);
            if (result && result.success && result.dataUrl) {
              dataUrl = result.dataUrl;
            }
          } catch (_) {}
        }

        // Fallback: legacy IndexedDB entry (pre-migration)
        if (!dataUrl && screenshotId) {
          try {
            dataUrl = await loadImageFromDB(screenshotId);
          } catch (_) {}
        }

        if (dataUrl) {
          const msgDiv = document.createElement('div');
          msgDiv.className = 'message user';
          const img = document.createElement('img');
          img.src = dataUrl;
          img.style.maxWidth = '250px';
          img.style.maxHeight = '150px';
          img.style.borderRadius = '8px';
          msgDiv.appendChild(img);
          if (chatMessages) {
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
        } else {
          addMessage('📷 Screenshot captured', 'system', true);
        }

        if (!skipPersist) {
          chatHistory.push({ kind: 'image', screenshotId, screenshotPath, time: new Date().toISOString() });
          saveHistory();
        }
      }

      // Display captured screenshot image in chat
      if (whysperAPI && whysperAPI.onScreenshotCaptured) {
        whysperAPI.onScreenshotCaptured((event, data) => {
          if (data && data.imageData) {
            const screenshotId = data.screenshotId || ('img-' + Date.now());
            // Show image thumbnail in chat
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            const img = document.createElement('img');
            img.src = data.imageData;
            img.dataset.imageId = screenshotId;
            img.style.maxWidth = '250px';
            img.style.maxHeight = '150px';
            img.style.borderRadius = '8px';
            msgDiv.appendChild(img);
            if (chatMessages) {
              chatMessages.appendChild(msgDiv);
              chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            // Cache to IndexedDB for fast hot-reload (best-effort);
            // the durable record is the session event + disk file.
            saveImageToDB(screenshotId, data.imageData).catch(() => {});
            chatHistory.push({
              kind: 'image',
              screenshotId: screenshotId,
              screenshotPath: data.screenshotPath || null,
              time: new Date().toISOString()
            });
            saveHistory();
          }
        });
      }

      // Reload history whenever the window becomes visible (handles hidden windows and quick toggles)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          loadHistory();
        }
      });

      // Initialize availability and history
      loadHistory().then(() => {
        initSpeechAvailability();
        if (!chatHistory || chatHistory.length === 0) {
          addMessage('Recording in Progress. press Alt+R to stop recording.', 'system');
        }
      });

      // Basic message function with markdown support for assistant messages
      function addMessage(text, type = 'user', skipPersist = false) {
        if (!chatMessages) {
          console.error('Chat messages element not found!');
          return;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;

        const roleDiv = document.createElement('div');
        roleDiv.className = 'message-role';
        roleDiv.textContent = ({ assistant: 'Assistant', transcription: 'You · Voice', user: 'You', system: 'Status', error: 'Error' })[type] || type;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Format assistant messages as markdown
        if (type === 'assistant') {
          textDiv.innerHTML = formatMarkdown(text);
          if (window.renderMathInElement) window.renderMathInElement(textDiv);
        } else {
          textDiv.textContent = text;
        }

        messageDiv.appendChild(roleDiv);
        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!skipPersist) {
          chatHistory.push({ kind: 'message', type, text });
          saveHistory();
        }
      }

      // Markdown formatter using markdown.js library (Maruku dialect for table support)
      function formatMarkdown(text) {
        if (!text) return '';
        
        try {
          if (typeof markdown !== 'undefined' && markdown.toHTML) {
            return markdown.toHTML(text, 'Maruku');
          } else {
            console.warn('Markdown library not loaded, falling back to basic formatting');
            return text
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>')
              .replace(/`(.+?)`/g, '<code>$1</code>')
              .replace(/\n/g, '<br>');
          }
        } catch (error) {
          console.error('Markdown parsing failed:', error);
          return text.replace(/\n/g, '<br>');
        }
      }

      // Show thinking indicator
      function showThinkingIndicator() {
        if (liveResponses.size > 0 || document.getElementById('thinking-indicator')) return;
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message assistant thinking';
        thinkingDiv.id = 'thinking-indicator';

        const roleDiv = document.createElement('div');
        roleDiv.className = 'message-role';
        roleDiv.textContent = 'Assistant';

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text thinking-dots';
        textDiv.innerHTML = '<span class="dot">•</span><span class="dot">•</span><span class="dot">•</span>';

        thinkingDiv.appendChild(roleDiv);
        thinkingDiv.appendChild(timeDiv);
        thinkingDiv.appendChild(textDiv);

        chatMessages.appendChild(thinkingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Hide thinking indicator
      function hideThinkingIndicator() {
        const thinkingIndicator = document.getElementById('thinking-indicator');
        if (thinkingIndicator) {
          thinkingIndicator.remove();
        }
      }

      // Minimalist Listening Animation Functions
      function showListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.remove('state-transcribing');
          listeningIndicator.classList.add('active', 'state-listening');
          if (listeningText) listeningText.textContent = 'Listening…';

          // Start timer
          listeningStartTime = Date.now();
          listeningTimer = setInterval(() => {
            if (listeningStartTime && listeningDuration) {
              const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
              listeningDuration.textContent = `${Math.min(elapsed, 60)}s / 60s`;
            }
          }, 1000);
        }
      }

      // Switches the wave indicator to "Transcribing…" instead of hiding it,
      // so the user knows their audio is still being processed after they
      // stop recording. Cancel remains available (soft-cancel; see
      // transcriptionCancelledForNextDraft).
      function showTranscribingState() {
        if (!listeningIndicator) return;
        listeningIndicator.classList.add('active', 'state-transcribing');
        listeningIndicator.classList.remove('state-listening');
        if (listeningText) listeningText.textContent = 'Transcribing…';
        if (listeningTimer) {
          clearInterval(listeningTimer);
          listeningTimer = null;
        }
        listeningStartTime = null;
      }

      function hideListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.remove('active', 'state-listening', 'state-transcribing');
        }

        // Hide interim overlay
        if (interimOverlay) {
          interimOverlay.classList.remove('active');
        }

        // Clear timer
        if (listeningTimer) {
          clearInterval(listeningTimer);
          listeningTimer = null;
        }

        listeningStartTime = null;
      }

      function showInterimText(text) {
        if (!interimOverlay) return;

        if (text && text.trim()) {
          interimOverlay.textContent = text;
          interimOverlay.classList.add('active');
        } else {
          interimOverlay.classList.remove('active');
        }
      }

      // Recording Event Handlers
      function handleRecordingStarted() {
        isRecording = true;
        cancelRecordingFlag = false;
        transcriptionCancelledForNextDraft = false;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'block';
        }
        if (micButton) {
          micButton.classList.add('recording');
        }

        showListeningAnimation();
      }

      // Called once the mic has stopped locally. The wave indicator switches
      // to "Transcribing…" (kept visible) rather than hiding immediately,
      // since the audio still needs to come back from the STT provider.
      function handleRecordingStopped() {
        isRecording = false;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'none';
        }
        if (micButton) {
          micButton.classList.remove('recording');
        }

        showTranscribingState();
      }

      async function startChatRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
          throw new Error('Microphone recording is not supported in this window.');
        }

        const settings = await whysperAPI.getSettings();
        const deviceId = settings && settings.microphoneDeviceId || 'default';
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia(
            deviceId === 'default' ? { audio: true } : { audio: { deviceId: { exact: deviceId } } }
          );
        } catch (error) {
          if (deviceId === 'default') throw error;
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          await whysperAPI.saveSettings({ microphoneDeviceId: 'default' });
        }
        const audioTrack = stream.getAudioTracks()[0];
        await new Promise((resolve) => setTimeout(resolve, 350));
        if (!stream.active || !audioTrack || audioTrack.readyState !== 'live') {
          throw new Error('The microphone did not become ready.');
        }

        // Tear down any previous recorder / stream before replacing them
        // (e.g. user starts recording again while a previous transcription
        // is still in-flight).  Order matters: set cancelRecordingFlag so
        // the old stop handler won't submit, null out chatMediaStream so the
        // old stop handler (which fires async) can't touch the new stream,
        // then stop the old recorder + old stream tracks.
        cancelRecordingFlag = true;
        const oldStream = chatMediaStream;
        chatMediaStream = null;
        if (chatMediaRecorder && chatMediaRecorder.state !== 'inactive') {
          try { chatMediaRecorder.stop(); } catch (_) {}
        }
        if (oldStream) {
          oldStream.getTracks().forEach((track) => track.stop());
        }

        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : 'audio/webm';
        chatMediaStream = stream;
        chatRecordingChunks = [];
        chatRecordingStartedAt = Date.now();

        // Bump the generation counter so any still-in-flight transcription
        // results from a previous recording are discarded — only the latest
        // recording's draft should land in the input box.
        const myGeneration = ++lastRecordingGeneration;

        chatMediaRecorder = new MediaRecorder(stream, { mimeType });
        chatMediaRecorder.addEventListener('dataavailable', (event) => {
          if (event.data && event.data.size) {
            chatRecordingChunks.push(event.data);
          }
        });
        chatMediaRecorder.addEventListener('stop', async () => {
          const chunks = chatRecordingChunks;
          const durationMs = Math.max(0, Date.now() - chatRecordingStartedAt);
          chatRecordingChunks = [];
          chatMediaRecorder = null;
          const wasCancelled = cancelRecordingFlag;
          cancelRecordingFlag = false;
          if (chatMediaStream) {
            chatMediaStream.getTracks().forEach((track) => track.stop());
            chatMediaStream = null;
          }
          if (wasCancelled) {
            return;
          }
          try {
            if (!chunks.length) throw new Error('No audio was captured.');
            const blob = new Blob(chunks, { type: mimeType });
            const result = await whysperAPI.submitAudioRecording({
              bytes: await blob.arrayBuffer(),
              mimeType,
              durationMs,
              generation: myGeneration,
            });
            if (!result || !result.success) {
              throw new Error(result && result.error || 'Unable to transcribe audio.');
            }
          } catch (error) {
            hideListeningAnimation();
            addMessage(`Audio recording failed: ${error.message}`, 'error');
          }
        }, { once: true });
        chatMediaRecorder.start(250);
        handleRecordingStarted();
        chatRecordingTimeout = setTimeout(() => {
          if (isRecording) {
            whysperAPI.notifyRecordingTimeout();
            stopChatRecording();
          }
        }, 60 * 1000);
      }

      function stopChatRecording() {
        if (chatRecordingTimeout) {
          clearTimeout(chatRecordingTimeout);
          chatRecordingTimeout = null;
        }
        handleRecordingStopped();
        const recorder = chatMediaRecorder;
        if (recorder && recorder.state !== 'inactive') {
          try {
            recorder.requestData();
          } catch (_) {}
          recorder.stop();
          return;
        }
        if (chatMediaStream) {
          chatMediaStream.getTracks().forEach((track) => track.stop());
          chatMediaStream = null;
        }
      }

      // Cancel while still recording: discard the audio outright, no
      // transcription request is ever sent for it.
      function cancelChatRecording() {
        if (chatRecordingTimeout) {
          clearTimeout(chatRecordingTimeout);
          chatRecordingTimeout = null;
        }
        cancelRecordingFlag = true;
        isRecording = false;
        if (recordingIndicator) recordingIndicator.style.display = 'none';
        if (micButton) micButton.classList.remove('recording');
        hideListeningAnimation();
        const recorder = chatMediaRecorder;
        if (recorder && recorder.state !== 'inactive') {
          recorder.stop();
        } else if (chatMediaStream) {
          chatMediaStream.getTracks().forEach((track) => track.stop());
          chatMediaStream = null;
        }
      }

      function handleTranscription(text) {
        if (text && typeof text === 'string' && text.trim().length > 0) {
          hideListeningAnimation();
          setTimeout(() => {
            addMessage(text.trim(), 'transcription');
            setTimeout(() => {
              showThinkingIndicator();
            }, 300);
          }, 200);
        } else {
          console.warn('Invalid or empty transcription text - ignoring:', text);
        }
      }

      // Called when a completed recording finishes transcribing. Unlike
      // handleTranscription() above (only used for legacy/dev test pings), this
      // does NOT add a chat bubble or trigger the LLM — it drops the text into
      // the editable message input so the user can review, edit, and manually
      // submit it (same as typing).
      function handleTranscriptionDraft(text) {
        const draft = String(text || '').trim();
        if (!draft || !messageInput) return;

        const existing = messageInput.value.trim();
        messageInput.value = existing ? `${existing} ${draft}` : draft;
        autoGrow(messageInput);
        messageInput.focus();
        const caret = messageInput.value.length;
        try {
          messageInput.setSelectionRange(caret, caret);
        } catch (_) {
          // setSelectionRange can throw for certain input types; safe to ignore.
        }
      }

      // Helpers to capture AI response into chat (text + snippets)
      function extractCodeBlocks(text) {
        if (!text) return [];
        const blocks = [];
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
        }
        return blocks;
      }
      function stripCodeBlocks(text, blocks) {
        let result = text || '';
        blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
        return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }
      function attachCopy(btn, codeText) {
        if (!btn) return;
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            let ok = false;
            if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
              ok = await window.electronAPI.copyToClipboard(codeText);
            }
            if (!ok) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(codeText);
                ok = true;
              } else {
                const ta = document.createElement('textarea');
                ta.value = codeText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                ok = true;
              }
            }
            if (ok) {
              btn.classList.add('copied');
              const original = btn.textContent;
              btn.textContent = 'Copied';
              setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
            }
          } catch (err) {
            console.warn('Copy failed', err);
          }
        });
      }
      function addCodeSnippet(language, code, skipPersist = false) {
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';

        const lang = (language || 'text').toLowerCase();

        // Code block wrapper (matches center panel design)
        const codeBlock = document.createElement('div');
        codeBlock.className = 'code-block';

        // Header with language label + copy button
        const header = document.createElement('div');
        header.className = 'code-header';
        const langLabel = document.createElement('span');
        langLabel.textContent = lang.toUpperCase();
        header.appendChild(langLabel);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        attachCopy(copyBtn, code || '');
        header.appendChild(copyBtn);

        // Code content area
        const codeContent = document.createElement('div');
        codeContent.className = 'code-content';
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');
        pre.appendChild(codeEl);
        codeContent.appendChild(pre);

        codeBlock.appendChild(header);
        codeBlock.appendChild(codeContent);
        textDiv.appendChild(codeBlock);

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);

        try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl, true); } } catch (_) {}

        if (!skipPersist) {
          chatHistory.push({ kind: 'snippet', language: lang, code: code || '' });
          saveHistory();
        }
      }
      function isChatNearBottom() {
        if (!chatMessages) return false;
        return chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 80;
      }

      function getLatestLiveResponseId() {
        const messageIds = Array.from(liveResponses.keys());
        return messageIds.length ? messageIds[messageIds.length - 1] : null;
      }

      function updateSendButtonMode() {
        if (!sendButton) return;
        const isStreaming = liveResponses.size > 0;
        sendButton.classList.toggle('stop-mode', isStreaming);
        sendButton.title = isStreaming ? 'Stop response' : 'Send message';
        sendButton.setAttribute('aria-label', sendButton.title);
        sendButton.innerHTML = isStreaming
          ? '<i class="fas fa-stop" aria-hidden="true"></i>'
          : '<i class="fas fa-paper-plane" aria-hidden="true"></i>';
      }

      async function stopLatestResponse() {
        const messageId = getLatestLiveResponseId();
        if (!messageId || !whysperAPI?.cancelLlmRequest) return false;
        sendButton.disabled = true;
        try {
          const result = await whysperAPI.cancelLlmRequest(messageId);
          return !!result?.aborted;
        } catch (error) {
          console.error('Failed to stop LLM response:', error);
          return false;
        } finally {
          sendButton.disabled = false;
        }
      }

      function beginStreamingResponse(messageId) {
        if (!messageId || liveResponses.has(messageId) || !chatMessages) return;
        hideThinkingIndicator();

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant streaming';
        messageDiv.dataset.streamId = messageId;

        const roleDiv = document.createElement('div');
        roleDiv.className = 'message-role';
        roleDiv.textContent = 'Assistant';

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';

        messageDiv.append(roleDiv, timeDiv, textDiv);
        chatMessages.appendChild(messageDiv);
        liveResponses.set(messageId, { messageDiv, textDiv, buffer: '' });
        updateSendButtonMode();
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function appendStreamingChunk(messageId, delta) {
        if (!messageId || !delta) return;
        if (!liveResponses.has(messageId)) beginStreamingResponse(messageId);
        const response = liveResponses.get(messageId);
        if (!response) return;
        const shouldFollow = isChatNearBottom();
        response.buffer += delta;
        response.textDiv.textContent = response.buffer;
        // Keep the top of the streaming bubble visible so the user reads
        // from the beginning; only auto-scroll when they are at the bottom.
        if (shouldFollow && response.messageDiv) {
          response.messageDiv.scrollIntoView({ block: 'start', behavior: 'instant' });
        }
      }

      function markResponseStopped(messageDiv) {
        if (!messageDiv) return;
        const status = document.createElement('div');
        status.className = 'response-status';
        status.textContent = 'Stopped';
        messageDiv.appendChild(status);
      }

      function finalizeStreamingResponse(messageId, response, stopped = false) {
        const liveResponse = messageId ? liveResponses.get(messageId) : null;
        if (!liveResponse) {
          if (response) renderAssistantResponse(response);
          return;
        }
        liveResponses.delete(messageId);
        updateSendButtonMode();
        if (!response || !response.trim()) {
          liveResponse.messageDiv.remove();
          if (stopped) addMessage('Response stopped', 'system', true);
          return;
        }
        renderAssistantResponse(response, liveResponse.messageDiv);
        if (stopped) markResponseStopped(liveResponse.messageDiv);
      }

      function renderAssistantResponse(response, existingMessageDiv = null) {
        if (!response || typeof response !== 'string') return;
        // Deduplication: avoid processing the same response twice
        const normalized = response.trim();
        const h = hashString(normalized);
        if (recentResponseHashes.has(h) && !existingMessageDiv) return;
        if (!recentResponseHashes.has(h)) {
          recentResponseHashes.add(h);
          if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
            const first = recentResponseHashes.values().next().value;
            recentResponseHashes.delete(first);
          }
        }

        // Parse response to maintain order of text and code blocks
        const segments = parseResponseSegments(response);
        
        // Create a single message container for the entire response
        const messageDiv = existingMessageDiv || document.createElement('div');
        messageDiv.className = 'message assistant';
        messageDiv.removeAttribute('data-stream-id');
        messageDiv.replaceChildren();
        
        const roleDiv = document.createElement('div');
        roleDiv.className = 'message-role';
        roleDiv.textContent = 'Assistant';
        
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Render each segment in order within the same message
        segments.forEach((segment) => {
          if (segment.type === 'text' && segment.content.trim().length) {
            const textContent = document.createElement('div');
            textContent.innerHTML = formatMarkdown(segment.content);
            textDiv.appendChild(textContent);
          } else if (segment.type === 'code') {
            const codeBlock = createCodeBlock(segment.language, segment.code);
            textDiv.appendChild(codeBlock);
          }
        });
        
        messageDiv.appendChild(roleDiv);
        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        if (!existingMessageDiv) chatMessages.appendChild(messageDiv);
        
        // Highlight all code blocks now that the message is in the DOM
        try { if (window.Prism && Prism.highlightAllUnder) { Prism.highlightAllUnder(messageDiv); } } catch (_) {}
        
        // Scroll to the new message
        if (isChatNearBottom()) {
          messageDiv.scrollIntoView({ block: 'end', behavior: 'smooth' });
        }
        
        // Save to history
        chatHistory.push({ kind: 'message', type: 'assistant', text: response });
        saveHistory();
      }

      // Parse response into ordered segments of text and code blocks
      function parseResponseSegments(text) {
        const segments = [];
        const codeBlockRegex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g;
        let lastIndex = 0;
        let match;
        
        while ((match = codeBlockRegex.exec(text)) !== null) {
          // Add text before this code block
          if (match.index > lastIndex) {
            const textContent = text.substring(lastIndex, match.index).trim();
            if (textContent) {
              segments.push({ type: 'text', content: textContent });
            }
          }
          
          // Add the code block
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          segments.push({
            type: 'code',
            language: langToken,
            code: match[3]
          });
          
          lastIndex = match.index + match[0].length;
        }
        
        // Add any remaining text after the last code block
        if (lastIndex < text.length) {
          const textContent = text.substring(lastIndex).trim();
          if (textContent) {
            segments.push({ type: 'text', content: textContent });
          }
        }
        
        return segments;
      }

      // Create a code block element
      function createCodeBlock(language, code) {
        const lang = (language || 'text').toLowerCase();
        
        const codeBlockDiv = document.createElement('div');
        codeBlockDiv.className = 'code-block';
        codeBlockDiv.style.marginTop = '10px';
        codeBlockDiv.style.marginBottom = '10px';
        
        // Header with language label + copy button
        const header = document.createElement('div');
        header.className = 'code-header';
        const langLabel = document.createElement('span');
        langLabel.textContent = lang.toUpperCase();
        header.appendChild(langLabel);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        attachCopy(copyBtn, code || '');
        header.appendChild(copyBtn);

        // Code content area
        const codeContent = document.createElement('div');
        codeContent.className = 'code-content';
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');
        pre.appendChild(codeEl);
        codeContent.appendChild(pre);

        codeBlockDiv.appendChild(header);
        codeBlockDiv.appendChild(codeContent);
        
        return codeBlockDiv;
      }

      // Basic IPC Event Listeners - simplified
      
      // Listen for transcription events
      if (whysperAPI) {
        whysperAPI.onTranscriptionReceived((event, data) => {
          if (data && data.text) {
            handleTranscription(data.text);
          } else {
            console.warn('Invalid transcription data received:', data);
          }
        });

        whysperAPI.onInterimTranscription((event, data) => {
          if (data && data.text) {
            showInterimText(data.text);
          }
        });

        // Speech-to-text draft: land the transcribed text in the editable
        // message input instead of auto-sending it or playing it back.
        if (whysperAPI.onTranscriptionDraftReady) {
          whysperAPI.onTranscriptionDraftReady((event, data) => {
            hideListeningAnimation();
            if (transcriptionCancelledForNextDraft) {
              transcriptionCancelledForNextDraft = false;
              return;
            }
            // data.generation is set by main.js. Discard results from a
            // recording that has since been superseded (user started a new
            // recording while this one was still transcribing).
            if (data && data.generation !== undefined && data.generation !== lastRecordingGeneration) {
              return;
            }
            if (data && data.text) handleTranscriptionDraft(data.text);
          });
        }

        whysperAPI.onAudioTranscriptionFailed((event, data) => {
          hideListeningAnimation();
          if (transcriptionCancelledForNextDraft) {
            transcriptionCancelledForNextDraft = false;
            return;
          }
          if (data && data.generation !== undefined && data.generation !== lastRecordingGeneration) {
            return;
          }
          if (data && data.error) addMessage(`Transcription failed: ${data.error}`, 'error');
        });

        // Listen for speech status
        whysperAPI.onSpeechStatus((event, data) => {
          if (data && data.status) {
            const routineAudioStatus = [
              'Recording audio',
              'Processing audio',
              'Transcribing audio',
              'One-minute recording limit reached; transcribing audio',
            ].includes(data.status);
            if (!routineAudioStatus) addMessage(data.status, 'system');

            if (data.status.includes('started') || data.status.includes('Recording')) {
              handleRecordingStarted();
            } else if (data.status.includes('stopped') || data.status.includes('ended')) {
              handleRecordingStopped();
            }
          }
        });

        // Listen for speech errors
        whysperAPI.onSpeechError((event, data) => {
          if (data && data.error) {
            addMessage(`Error in recognizing speech`, 'error');
            handleRecordingStopped();
          }
        });

        // Listen for other events
        whysperAPI.onRecordingStarted(() => {
          handleRecordingStarted();
        });

        whysperAPI.onRecordingStopped(() => {
          handleRecordingStopped();
        });

        whysperAPI.onSessionCleared(() => {
          clearChatHistory(true, true);
          addMessage('Session memory has been cleared', 'system');
        });

        if (whysperAPI.onTranscriptionLlmResponseStart) {
          whysperAPI.onTranscriptionLlmResponseStart((event, data) => {
            if (data && data.messageId) beginStreamingResponse(data.messageId);
          });
        }

        if (whysperAPI.onTranscriptionLlmResponseChunk) {
          whysperAPI.onTranscriptionLlmResponseChunk((event, data) => {
            if (data && data.messageId) {
              appendStreamingChunk(data.messageId, data.delta || '');
            }
          });
        }

        if (whysperAPI.onLlmRequestAborted) {
          whysperAPI.onLlmRequestAborted((event, data) => {
            if (data && data.messageId) {
              const liveResponse = liveResponses.get(data.messageId);
              const partialText = data.partialText || liveResponse?.buffer || '';
              finalizeStreamingResponse(data.messageId, partialText, true);
            }
          });
        }

        const handleStreamingError = (data, prefix) => {
          hideThinkingIndicator();
          const liveResponse = data?.messageId ? liveResponses.get(data.messageId) : null;
          if (liveResponse) {
            liveResponse.messageDiv.remove();
            liveResponses.delete(data.messageId);
            updateSendButtonMode();
          }
          if (data?.error) addMessage(`${prefix}: ${data.error}`, 'error', true);
        };
        if (whysperAPI.onLlmError) {
          whysperAPI.onLlmError((event, data) => handleStreamingError(data, 'LLM Error'));
        }
        if (whysperAPI.onOcrError) {
          whysperAPI.onOcrError((event, data) => handleStreamingError(data, 'Screenshot Error'));
        }

        // Final response formats the live bubble, or renders a new one when a
        // provider had to use the existing non-streaming fallback.
        whysperAPI.onTranscriptionLlmResponse((event, data) => {
          if (data && data.response) {
            try { hideThinkingIndicator(); } catch (_) {}
            finalizeStreamingResponse(data.messageId, data.response);
          }
        });
      }

      // UI Event Listeners
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => clearChatHistory());
      }

      if (micButton) {
        micButton.addEventListener('click', async () => {
          if (!isInteractive) {
            addMessage('Window is in non-interactive mode. Press Alt+A to enable interaction.', 'error');
            return;
          }
          if (!speechAvailable) {
            addMessage('Speech recognition is not configured.', 'system');
            return;
          }
          if (isStartingRecording) {
            addMessage('Starting microphone…', 'system');
            return;
          }

          try {
            if (isRecording) {
              stopChatRecording();
            } else {
              isStartingRecording = true;
              await startChatRecording();
            }
          } catch (error) {
            stopChatRecording();
            addMessage(`Unable to start microphone recording: ${error.message}`, 'error');
          } finally {
            isStartingRecording = false;
          }
        });
      }

      if (listeningCancelBtn) {
        listeningCancelBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isRecording) {
            cancelChatRecording();
          } else {
            // Already stopped and transcribing in the background — the STT
            // request can't be aborted mid-flight, so just make sure its
            // result is ignored when it comes back.
            transcriptionCancelledForNextDraft = true;
            hideListeningAnimation();
          }
        });
      }

      window.addEventListener('beforeunload', stopChatRecording);

      if (sendButton) {
        sendButton.addEventListener('click', async () => {
          if (liveResponses.size > 0) {
            await stopLatestResponse();
            return;
          }
          const text = messageInput.value.trim();
          if (text) {
            addMessage(text, 'user');
            messageInput.value = '';
            
            showThinkingIndicator();
            
            // Send to main process for session memory storage and LLM processing
            try {
              if (whysperAPI && whysperAPI.sendChatMessage) {
                await whysperAPI.sendChatMessage(text);
              }
            } catch (error) {
              hideThinkingIndicator();
              console.error('Failed to send chat message to main process:', error);
              addMessage(`Unable to send message: ${error.message}`, 'error', true);
            }
          }
        });
      }

      // Auto-resize for multiline textarea
      function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        const max = 140; // keep within container limits
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      }
      if (messageInput) {
        autoGrow(messageInput);
        messageInput.addEventListener('input', () => autoGrow(messageInput));
      }

      // Replace keypress with keydown to support Shift+Enter for newline and Enter to send
      if (messageInput) {
        messageInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
              addMessage(text, 'user');
              messageInput.value = '';
              autoGrow(messageInput);
              showThinkingIndicator();
              try {
                if (whysperAPI && whysperAPI.sendChatMessage) {
                  await whysperAPI.sendChatMessage(text);
                }
              } catch (error) {
                hideThinkingIndicator();
                console.error('Failed to send chat message to main process:', error);
                addMessage(`Unable to send message: ${error.message}`, 'error', true);
              }
            }
          }
          // If Shift+Enter, allow default to insert newline
        });
      }

      // Global keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key === 'r') {
          e.preventDefault();
          if (!isInteractive || !speechAvailable) return;
          micButton && micButton.click();
        }
      });

      // Initialize — loadHistory is called earlier via the async path above
    </script>
  </body>
</html>
